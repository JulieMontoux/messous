name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  front:
    name: Front (lint, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  api:
    name: API (tests sur PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: messous
          POSTGRES_USER: messous
          # Base jetable du CI : pas de mot de passe (aucun secret dans le dépôt)
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U messous"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: api
    env:
      DATABASE_URL: postgres://messous@localhost:5432/messous
      TZ: Europe/Paris
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      # Tests + couverture minimale de 80 % par fichier (lignes, fonctions, branches)
      - run: npm run test:coverage

  e2e:
    name: Parcours de bout en bout (Playwright)
    runs-on: ubuntu-latest
    needs: [front, api]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: messous
          POSTGRES_USER: messous
          # Base jetable du CI : pas de mot de passe (aucun secret dans le dépôt)
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U messous"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgres://messous@localhost:5432/messous
      TZ: Europe/Paris
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: api
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
