# Analyse SonarCloud (https://sonarcloud.io) — lancée par la CI après les tests
sonar.organization=juliemontoux
sonar.projectKey=JulieMontoux_messous
sonar.projectName=MesSous

sonar.sources=src,api/src
sonar.tests=src,api/test,e2e
sonar.test.inclusions=src/**/*.test.js,src/**/*.test.jsx,src/test/**,api/test/**,e2e/**
sonar.exclusions=src/**/*.test.js,src/**/*.test.jsx,src/test/**,**/node_modules/**,dist/**,coverage/**
sonar.coverage.exclusions=src/main.jsx,api/src/index.js
sonar.javascript.lcov.reportPaths=coverage/lcov.info,api/coverage/lcov.info
sonar.sourceEncoding=UTF-8
